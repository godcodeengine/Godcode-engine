<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog — God Code</title>
<meta name="description" content="Notes and invitations from the God Code journey.">
<style>
  :root { --paper:#F4F1EA; --card:#FBFAF5; --ink:#1C1A17; --ink-soft:#4A453B; --ink-faint:#7E7666;
          --bronze:#8A6D1F; --bronze-deep:#6E5718; --line:#DCD4BC; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
         line-height: 1.65; font-size: 16px; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 22px 72px; }
  .mark { display: block; width: 84px; margin: 0 auto 22px; border-radius: 18px; }
  h1 { text-align: center; font-family: Georgia,'Palatino Linotype',serif; font-weight: 500;
       font-size: 34px; margin: 0 0 6px; letter-spacing: .01em; }
  .sub { text-align: center; color: var(--ink-soft); margin: 0 0 28px; font-size: 17px; }
  .topnav { display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; margin: 0 0 36px; }
  .topnav a { color: var(--ink-faint); font-size: 13.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 28px 26px; margin-bottom: 20px; }
  .card .date { color: var(--ink-faint); font-size: 13.5px; margin: 0 0 4px; }
  .card h2 { margin: 0 0 8px; font-family: Georgia,serif; font-weight: 500; font-size: 22px; }
  .card h2 a { color: var(--ink); text-decoration: none; }
  .card h2 a:hover { color: var(--bronze-deep); }
  .card p { color: var(--ink-soft); margin: 0; }
  .home { display: block; text-align: center; margin-top: 28px; color: var(--bronze); text-decoration: none; }
  .home:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="/images/icon.png" alt="God Code mark">
  <h1>Blog</h1>
  <p class="sub">Notes and invitations from the journey.</p>
  <nav class="topnav">
    <a href="../">Home</a>
    <a href="../playground/">Playground</a>
    <a href="../learn/">Learn</a>
    <a href="../demos/">Demos</a>
    <a href="https://github.com/godcodeengine/Godcode-engine">GitHub</a>
    <a href="https://discord.gg/894FEJhWfZ">Discord</a>
  </nav>

  <div class="card">
    <p class="date">October 10, 2026</p>
    <h2><a href="calling-all-builders.html">Calling all builders</a></h2>
    <p>An invitation to write the language with us this Hacktoberfest. Real open tasks, real merged contributions, and a door held open for you.</p>
  </div>

  <a class="home" href="../">&larr; Back to getgodcode.com</a>
</div>
</body>
</html>
