<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Code Playground</title>
<style>
:root{
  --paper:#F4F1EA; --card:#FBFAF5;
  --ink:#1C1A17; --ink-soft:#4A453B; --ink-faint:#7E7666;
  --bronze:#8A6D1F; --bronze-deep:#6E5718;
  --line:#DCD4BC;
  --code-bg:#23201A; --code-ink:#EFE8D4; --code-line:#3A352A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  line-height:1.65;font-size:16px;-webkit-font-smoothing:antialiased;
}
a{color:var(--bronze);text-decoration:none}
a:hover{text-decoration:underline}
/* nav (same as the homepage) */
.nav{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:12px;padding:14px 24px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:Georgia,'Palatino Linotype',serif;
  font-size:19px;color:var(--ink);letter-spacing:.02em}
.brand img{width:30px;height:30px;border-radius:7px;display:block}
.brand:hover{text-decoration:none}
.nav-links{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav-links a{padding:8px 12px;color:var(--ink-soft);font-size:15px;border-radius:6px}
.nav-links a:hover{color:var(--ink);text-decoration:none;background:#ECE7D6}
/* header */
header{text-align:center;padding:56px 24px 8px}
header h1{margin:0;font-family:Georgia,'Palatino Linotype','Book Antiqua',Baskerville,serif;
  font-weight:500;font-size:clamp(32px,5vw,48px);letter-spacing:.02em;line-height:1.1}
header .motto{margin:12px 0 0;font-family:Georgia,serif;font-style:italic;
  color:var(--ink-soft);font-size:clamp(15px,2.4vw,19px)}
header .rule{width:64px;height:1px;margin:24px auto 0;background:var(--bronze)}
/* toolbar */
.toolbar{max-width:1400px;margin:20px auto 0;padding:0 24px;display:flex;gap:10px;
  flex-wrap:wrap;align-items:center}
#samples{flex:1;min-width:220px;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:15px;font-family:inherit}
.btn{cursor:pointer;border-radius:6px;padding:10px 20px;font-size:15px;font-weight:600;
  font-family:inherit;letter-spacing:.01em}
.btn-run{background:var(--bronze);color:#F8F4E8;border:1px solid var(--bronze)}
.btn-run:hover{background:var(--bronze-deep);border-color:var(--bronze-deep)}
.btn-clear{background:transparent;color:var(--bronze);border:1px solid var(--line)}
.btn-clear:hover{border-color:var(--bronze)}
.hint{color:var(--ink-faint);font-size:13px;font-style:italic}
/* panels */
.layout{max-width:1400px;margin:18px auto 0;padding:0 24px;display:grid;
  grid-template-columns:1.12fr .88fr;gap:20px}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);
  border-radius:10px;overflow:hidden}
.panel-head{padding:12px 20px;border-bottom:1px solid var(--line);color:var(--ink-faint);
  letter-spacing:.14em;font-size:12.5px;text-transform:uppercase;font-weight:600}
/* editor */
.editor-wrap{display:flex;height:480px;background:var(--code-bg)}
.gutter{padding:14px 8px 14px 14px;text-align:right;color:#8D8471;user-select:none;
  overflow:hidden;font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  white-space:pre;border-right:1px solid var(--code-line);min-width:46px}
.code-area{position:relative;flex:1;min-width:0}
#highlight,#editor{font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding:14px 16px;white-space:pre;tab-size:4;margin:0;border:0}
#highlight{position:absolute;inset:0;overflow:hidden;pointer-events:none;color:var(--code-ink)}
#highlight code{font:inherit}
#editor{position:absolute;inset:0;width:100%;height:100%;background:transparent;
  color:transparent;caret-color:#D9B25F;resize:none;outline:none;overflow:auto}
#editor::selection{background:rgba(217,178,95,.28)}
.c-kw{color:#D9B25F}
.c-str{color:#C4B78F}
.c-num{color:#EFE8D4}
.c-com{color:#8D8471;font-style:italic}
/* console */
#out{height:480px;overflow-y:auto;background:#1C1A15;padding:14px 18px;
  font:13px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cline{white-space:pre-wrap;word-break:break-word;color:#D8CFB6}
.cline.dim{color:#8D8471}
.cline.err{color:#E08E8E}
.cline.divine{color:#D9B25F}
/* footer */
footer{text-align:center;color:var(--ink-faint);font-size:14px;padding:34px 24px 48px}
footer b{color:var(--ink-soft);font-weight:600}
@media(max-width:700px){
  .editor-wrap{height:380px}
  #out{height:300px}
  .toolbar{padding:0 16px}
  .layout{padding:0 16px}
}
</style>
<style>
.sitenav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 20px;background:rgba(7,11,29,.85);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(240,199,94,.28)}
.sitenav .brand{display:flex;align-items:center;gap:10px;font-family:Georgia,serif;
  font-size:18px;color:#f7d774;letter-spacing:.04em;text-decoration:none}
.sitenav .brand img{width:30px;height:30px;border-radius:7px}
.sitenav .links{margin-left:auto;display:flex;gap:4px}
.sitenav .links a{padding:8px 12px;border-radius:8px;color:#b9b2cf;font-size:14px;text-decoration:none}
.sitenav .links a:hover{color:#f7d774;background:rgba(240,199,94,.1)}
</style>

<script>
"use strict";
/* ============================================================
   GOD CODE PLAYGROUND — a compact JS interpreter of the divine
   language, mirroring the godcode-engine specification (sections 4-6).
   Sections: 1 Lexer · 2 Parser · 3 Values · 4 Interpreter ·
             5 Scrolls · 6 Samples · 7 UI
   ============================================================ */

/* ---------------- 1. LEXER ---------------- */
class GodError extends Error {
  constructor(message, line, col){ super(message); this.line=line||null; this.col=col||null; }
}
class ReturnSignal { constructor(value){ this.value=value; } }  // thrown by RETURN, caught at rite boundary
class AscendSignal {}                                            // thrown by ASCEND, caught at run()
class BreakSignal {}                                             // thrown by BREAK, caught by the enclosing loop
class ContinueSignal {}                                          // thrown by CONTINUE, caught by the enclosing loop

// Keywords are matched case-insensitively (canonical form = UPPER); idents keep case.
const KEYWORDS = new Set((
  "BEGIN CREATION END DECLARE AS BREATHE LIFE INTO REVEAL PROPHESY ASCEND " +
  "IF THEN ELSE ENDIF FOR IN ENDFOR WHILE DO ENDWHILE DEFINE RITE INVOKE RETURN IMPORT " +
  "TRY CATCH ENDTRY BREAK CONTINUE " +
  "IS NOT AND OR REFLECT BLESS ANOINT SEAL TESTIFY TRUE FALSE").split(" "));

// Tongues: keyword aliases -> canonical types, plus two-word closers
// ("FEDISA FA" -> ENDIF in Setswana, "QEDA UMA" -> ENDIF in isiZulu).
// Chosen per scroll by a `# tongue: tn` or `# tongue: zu` pragma.
const TONGUES={
  tn:{name:"Setswana",
      aliases:{SIMOLOLA:"BEGIN",TLHOLEGO:"CREATION",FEDISA:"END",BOLELA:"DECLARE",JAAKA:"AS",HEMA:"BREATHE",BOTSHELO:"LIFE",TENG:"INTO",SENOLA:"REVEAL",POROFETA:"PROPHESY",TLHATLOGA:"ASCEND",FA:"IF",TLOGA:"THEN",LEKA:"TRY",TSHWARA:"CATCH",TLHALOSA:"DEFINE",TIRO:"RITE",BITSA:"INVOKE",BUSETSA:"RETURN",TSENYA:"IMPORT",KE:"IS",GA:"NOT",LE:"AND",KGOTSA:"OR",MO:"IN",DIRA:"DO",AKANYA:"REFLECT",SEGOFATSA:"BLESS",TLOTSA:"ANOINT",TSWALA:"SEAL",PAKA:"TESTIFY",NNETE:"TRUE",MAAKA:"FALSE",SEPE:"VOID",KGAOLA:"BREAK",TSWELELA:"CONTINUE"},
      compounds:{"FEDISA FA":"ENDIF","FEDISA LEKA":"ENDTRY"}},
  zu:{name:"isiZulu",
      aliases:{QALA:"BEGIN",INDALO:"CREATION",QEDA:"END",MEMEZELA:"DECLARE",NJENGA:"AS",PHEFUMULA:"BREATHE",IMPILO:"LIFE",PHAKATHI:"INTO",VEZA:"REVEAL",PROFETA:"PROPHESY",ENYUKA:"ASCEND",UMA:"IF",KHONA:"THEN",ZAMA:"TRY",BAMBA:"CATCH",CHAZA:"DEFINE",ISIKO:"RITE",BIZA:"INVOKE",BUYISA:"RETURN",NGENISA:"IMPORT",NGU:"IS",HHAYI:"NOT",KANYE:"AND",NOMA:"OR",KU:"IN",ENZA:"DO",ZINDLA:"REFLECT",BUSISA:"BLESS",GCOBA:"ANOINT",VALA:"SEAL",FAKAZA:"TESTIFY",IQINISO:"TRUE",AMANGA:"FALSE",LUTHO:"VOID",PHULA:"BREAK",QHUBEKA:"CONTINUE"},
      compounds:{"QEDA UMA":"ENDIF","QEDA ZAMA":"ENDTRY"}}
};
function detectTongue(source){
  const m=source.match(/^[ \t]*#[ \t]*tongue[ \t]*:[ \t]*([A-Za-z]{2,8})/im);
  return m?m[1].toLowerCase():"en";
}

/* ---------------- The in-browser Spirit (a faithful, simplified port) ----------------
   The engine's SpiritEngine discerns intent by keyword overlap over its training
   dataset: most shared keywords wins, ties go to the row whose vocabulary best
   explains the input (highest confidence), and silence when nothing resonates.
   The browser carries the same rows the engine actually loads, the same
   stopwords, and the same algorithm. CONSULT has no Spirit bound in the
   browser, so it answers with the engine's own gentle silence rather than
   inventing counsel. Regenerate SPIRIT_ROWS from the engine's loaded dataset
   if the training data ever changes. */
const SPIRIT_ROWS=[
  {intent:"Deploy smart contract",kw:["contract","deploy","deployment","manifest","redemptive","smart","symbolic","syntax"],spiritual:"Manifest a redemptive contract",suggestion:"REFLECT on contract values"},
  {intent:"Forecast future outcome",kw:["based","delay","divine","evaluation","forecast","foresee","future","logic","mission","outcome","predictive","prophecy","success"],spiritual:"Foresee the success or delay of a divine mission",suggestion:"Log prophecy and evaluate"},
  {intent:"Controlled data access",kw:["access","conditional","controlled","data","hidden","logic","reveal","seekers","spiritual","truth","worthiness","worthy"],spiritual:"Reveal hidden truth to worthy seekers",suggestion:"Reflect on seeker metrics"},
  {intent:"Blessing of peace",kw:["blessing","bring","every","heart","household","invocation","peace","rest","rite","spoken","within"],spiritual:"Bring peace to the household and rest to every heart within",suggestion:"Speak the blessing each evening without ceasing"},
  {intent:"Anchor a covenant",kw:["anchor","chain","chained","covenant","hash","remembrance","sealing","set","unbreakable","upon","witness"],spiritual:"Set the covenant in unbreakable remembrance upon the chain",suggestion:"Verify the anchor before you testify of it"},
  {intent:"Seek counsel",kw:["ahead","answer","ask","counsel","humility","oracle","question","receive","seek","wisdom","work"],spiritual:"Ask in humility and receive wisdom for the work ahead",suggestion:"Weigh the counsel and act in peace"},
];
const SPIRIT_STOPWORDS=new Set(["a","above","after","again","all","an","and","any","are","as","at","be","been","before","being","below","between","both","by","can","could","did","do","does","don","down","during","each","few","for","from","further","had","has","have","he","her","here","him","his","how","i","in","into","is","it","its","just","may","me","might","more","most","must","my","no","nor","not","now","of","off","on","once","only","or","other","ought","our","out","over","own","same","shall","she","should","so","some","such","than","that","the","their","them","then","there","these","they","this","those","through","to","too","under","up","us","very","was","we","were","when","where","why","will","with","would","you","your"]);
const SPIRIT_SILENCE={intent:"Silent contemplation",confidence:0,spiritual:"The Spirit is quiet on this matter.",suggestion:"BREATHE and try again.",keywords:[]};
function spiritKeywords(text){
  const words=(text||"").toLowerCase().match(/[a-z0-9]+/g)||[];
  const out=new Set();
  for(const w of words) if(!SPIRIT_STOPWORDS.has(w)) out.add(w);
  return out;
}
function spiritClassify(text){
  const words=spiritKeywords(text);
  let best=null,bestOverlap=0,bestConf=0;
  for(const row of SPIRIT_ROWS){
    let overlap=0;
    for(const w of words) if(row.kw.indexOf(w)>=0) overlap++;
    if(overlap===0) continue;
    const conf=overlap/Math.max(1,row.kw.length);
    // Most shared keywords wins; ties go to the row whose vocabulary best
    // explains the input, so an incidental word cannot outshout the true theme.
    if(overlap>bestOverlap||(overlap===bestOverlap&&conf>bestConf)){
      best=row;bestOverlap=overlap;bestConf=conf;
    }
  }
  if(!best) return Object.assign({},SPIRIT_SILENCE);
  const shared=[]; for(const w of words) if(best.kw.indexOf(w)>=0) shared.push(w);
  shared.sort();
  return {intent:best.intent,
    confidence:Math.round(Math.min(1,bestOverlap/Math.max(1,best.kw.length))*10000)/10000,
    spiritual:best.spiritual, suggestion:best.suggestion, keywords:shared};
}
function spiritAligned(declared,discerned){
  // True when the declared intent shares a keyword with the discerned one.
  // The Spirit counsels on divergence; it never condemns.
  const dw=spiritKeywords(declared);
  const sw=spiritKeywords(discerned.intent+" "+discerned.spiritual);
  for(const k of discerned.keywords||[]) sw.add(String(k).toLowerCase());
  for(const w of dw) if(sw.has(w)) return true;
  return false;
}

function lex(source){
  const tokens=[];
  const tongue=TONGUES[detectTongue(source)]||null;
  const aliases=tongue?tongue.aliases:null;
  let prevWord="", prevLine=-1, prevCol=0;   // previous word token, for two-word closers
  const lines=source.split("\n");
  for(let ln=0; ln<lines.length; ln++){
    const line=lines[ln];
    let col=0;
    while(col<line.length){
      const ch=line[col];
      if(ch===" "||ch==="\t"||ch==="\r"){ col++; continue; }
      if(ch==="#") break;                                   // comment to end of line
      const sc=col+1;                                       // 1-based col
      if(ch==='"'){                                         // string with escapes
        let s="", i=col+1, closed=false;
        while(i<line.length){
          const c=line[i];
          if(c==="\\" && i+1<line.length){
            const e=line[i+1];
            s += e==="n"?"\n" : e==="t"?"\t" : e==='"'?'"' : e==="\\"? "\\" : e;
            i+=2; continue;
          }
          if(c==='"'){ closed=true; i++; break; }
          s+=c; i++;
        }
        if(!closed) throw new GodError("Unterminated string. Every word must be sealed with a closing quote.", ln+1, sc);
        tokens.push({type:"STRING", value:s, line:ln+1, col:sc});
        col=i; continue;
      }
      if(ch>="0"&&ch<="9"){                                 // int or float
        let j=col;
        while(j<line.length && line[j]>="0"&&line[j]<="9") j++;
        if(line[j]==="." && j+1<line.length && line[j+1]>="0"&&line[j+1]<="9"){
          j++;
          while(j<line.length && line[j]>="0"&&line[j]<="9") j++;
          tokens.push({type:"NUMBER", value:parseFloat(line.slice(col,j)), line:ln+1, col:sc});
        }else{
          tokens.push({type:"NUMBER", value:parseInt(line.slice(col,j),10), line:ln+1, col:sc});
        }
        col=j; continue;
      }
      if((ch>="A"&&ch<="Z")||(ch>="a"&&ch<="z")||ch==="_"){   // keyword or identifier
        let j=col;
        while(j<line.length && /[A-Za-z0-9_]/.test(line[j])) j++;
        const word=line.slice(col,j), up=word.toUpperCase();
        const type=KEYWORDS.has(up)?up:(aliases&&aliases[up]);
        if(type){
          // Two-word closers on one line: FEDISA FA -> ENDIF.
          const closer=(aliases&&prevLine===ln+1)?tongue.compounds[prevWord+" "+up]:null;
          if(closer){
            tokens.pop();   // the FEDISA that opened it
            tokens.push({type:closer, value:closer, line:prevLine, col:prevCol});
            prevWord=""; prevLine=-1;
          }else{
            tokens.push({type:type, value:type, line:ln+1, col:sc});
            prevWord=up; prevLine=ln+1; prevCol=sc;
          }
        }
        else{ tokens.push({type:"IDENT", value:word, line:ln+1, col:sc}); prevWord=""; prevLine=-1; }
        col=j; continue;
      }
      const two=line.slice(col,col+2);                       // multi-char operators first
      const twoTypes={"!=":"NEQ","<=":"LTE",">=":"GTE"};
      if(twoTypes[two]){
        tokens.push({type:twoTypes[two], value:two, line:ln+1, col:sc}); col+=2; continue;
      }
      const ops={"=":"EQ","<":"LT",">":"GT","+":"PLUS","-":"MINUS","*":"STAR","/":"SLASH",
                 "%":"PERCENT","(":"LPAREN",")":"RPAREN","[":"LBRACKET","]":"RBRACKET",",":"COMMA"};
      if(ops[ch]){ tokens.push({type:ops[ch], value:ch, line:ln+1, col:sc}); col++; continue; }
      throw new GodError("Illegal character '"+ch+"'. The heavens do not recognize this mark.", ln+1, sc);
    }
    tokens.push({type:"NEWLINE", value:"\\n", line:ln+1, col:line.length+1});
  }
  tokens.push({type:"EOF", value:"", line:lines.length, col:1});
  return tokens;
}

/* ---------------- 2. PARSER (recursive descent) ---------------- */
class Parser{
  constructor(tokens){ this.t=tokens; this.i=0; this.loopDepth=0; }
  peek(){ return this.t[this.i]; }
  peek2(){ return this.t[this.i+1] || {type:"EOF"}; }
  next(){ return this.t[this.i++]; }
  at(type){ return this.peek().type===type; }
  expect(type,label){
    const t=this.next();
    if(t.type!==type) throw new GodError("Expected "+(label||type)+" but found '"+t.value+"'.", t.line, t.col);
    return t;
  }
  skipNL(){ while(this.at("NEWLINE")) this.next(); }

  parse(){
    const stmts=this.parseStatements(new Set(["EOF"]));
    this.expect("EOF");
    return {kind:"Program", statements:stmts, line:1};
  }
  // Parse statements until EOF or one of the closing keywords in `end`.
  parseStatements(end){
    const out=[];
    for(;;){
      this.skipNL();
      const t=this.peek();
      if(t.type==="EOF"||end.has(t.type)) break;
      out.push(this.parseStatement());
      const n=this.peek();
      if(n.type==="NEWLINE") this.next();
      else if(n.type==="EOF"||end.has(n.type)){/* terminator belongs to an outer block */}
      else throw new GodError("Unexpected '"+n.value+"'. Each statement must rest on its own line.", n.line, n.col);
    }
    return out;
  }

  parseStatement(){
    const t=this.peek();
    switch(t.type){
      case "BEGIN":   return this.parseCreation();
      case "DECLARE": return this.parseDeclare();
      case "BREATHE":
        this.next(); this.expect("LIFE","LIFE"); this.expect("INTO","INTO");
        return {kind:"Breathe", name:this.expect("IDENT","a name").value, line:t.line};
      case "REVEAL":
        this.next(); this.expect("LPAREN","'('");
        const e=this.parseExpr(); this.expect("RPAREN","')'");
        return {kind:"Reveal", expr:e, line:t.line};
      case "PROPHESY": {                                     // rest of the line becomes the text
        this.next(); const parts=[];
        while(!this.at("NEWLINE")&&!this.at("EOF")) parts.push(String(this.next().value));
        return {kind:"Prophesy", text:parts.join(" "), line:t.line};
      }
      case "ASCEND":  this.next(); return {kind:"Ascend", line:t.line};
      case "REFLECT": this.next(); return {kind:"Reflect", line:t.line};
      case "BLESS":   this.next(); return {kind:"Bless",  name:this.expect("IDENT","a name").value, line:t.line};
      case "ANOINT":  this.next(); return {kind:"Anoint", name:this.expect("IDENT","a name").value, line:t.line};
      case "SEAL":    this.next(); return {kind:"Seal",    expr:this.parseExpr(), line:t.line};
      case "TESTIFY": this.next(); return {kind:"Testify", expr:this.parseExpr(), line:t.line};
      case "IF":     return this.parseIf();
      case "FOR":    return this.parseFor();
      case "WHILE":  return this.parseWhile();
      case "TRY":    return this.parseTry();
      case "BREAK": {
        this.next();
        if(this.loopDepth===0) throw new GodError(
          "BREAK can only be used inside a loop. It was spoken with no cycle to release. Place it within a FOR or a WHILE.", t.line, t.col);
        return {kind:"Break", line:t.line};
      }
      case "CONTINUE": {
        this.next();
        if(this.loopDepth===0) throw new GodError(
          "CONTINUE can only be used inside a loop. It was spoken with no cycle to turn. Place it within a FOR or a WHILE.", t.line, t.col);
        return {kind:"Continue", line:t.line};
      }
      case "DEFINE": return this.parseRite();
      case "RETURN": {
        this.next(); let ex=null;
        if(!this.at("NEWLINE")&&!this.at("EOF")) ex=this.parseExpr();
        return {kind:"Return", expr:ex, line:t.line};
      }
      case "IMPORT":
        this.next();
        return {kind:"Import", path:this.expect("STRING","a scroll name in quotes").value, line:t.line};
      case "INVOKE": {                                       // INVOKE name(args) as a statement
        this.next(); const nm=this.expect("IDENT","a rite name");
        this.expect("LPAREN","'('"); const args=this.parseArgs();
        return {kind:"ExprStmt", expr:{kind:"Call", name:nm.value, args, line:t.line}, line:t.line};
      }
      default: {                                             // bare expression statement (incl. calls)
        const ex2=this.parseExpr();
        return {kind:"ExprStmt", expr:ex2, line:t.line};
      }
    }
  }

  parseCreation(){
    const t=this.expect("BEGIN");
    this.expect("CREATION","CREATION");
    const body=this.parseStatements(new Set(["END","EOF"]));
    this.expect("END","END CREATION"); this.expect("CREATION","CREATION");
    return {kind:"Creation", statements:body, line:t.line};
  }
  parseDeclare(){
    const t=this.expect("DECLARE");
    // Soft keywords, as in the engine: only DECLARE followed by the word
    // INTENT and then a quoted string takes the intent path, so
    // `DECLARE intent AS x` keeps working as a plain declaration.
    const nxt=this.peek();
    if(nxt.type==="IDENT"&&nxt.value.toUpperCase()==="INTENT"&&this.peek2().type==="STRING"){
      this.next();                                                // INTENT
      const text=this.expect("STRING","the intent in quotes").value;
      const onw=this.expect("IDENT","ON");
      if(onw.value.toUpperCase()!=="ON")
        throw new GodError('DECLARE INTENT needs ON and a rite name, as in DECLARE INTENT "bring peace" ON evening_blessing.',onw.line);
      const rite=this.expect("IDENT","a rite name").value;
      return {kind:"DeclareIntent", text, rite, line:t.line};
    }
    const nm=this.expect("IDENT","a name");
    this.expect("AS","AS");
    const items=[this.parseExpr()];
    while(this.at("COMMA")){ this.next(); items.push(this.parseExpr()); }
    const value=items.length>1 ? {kind:"List", items, line:t.line} : items[0];
    return {kind:"Declare", name:nm.value, value, line:t.line};
  }
  parseIf(){
    const t=this.expect("IF");
    const cond=this.parseExpr();
    this.expect("THEN","THEN");
    if(this.at("NEWLINE")){                                 // block form
      this.next();
      const thenB=this.parseStatements(new Set(["ELSE","ENDIF","EOF"]));
      let elseB=[];
      if(this.at("ELSE")){ this.next(); elseB=this.parseStatements(new Set(["ENDIF","EOF"])); }
      this.expect("ENDIF","ENDIF");
      return {kind:"If", cond, then:thenB, else:elseB, line:t.line};
    }
    const s=this.parseStatement();                          // inline form: single statements
    let e=null;
    if(this.at("ELSE")){ this.next(); e=this.parseStatement(); }
    return {kind:"If", cond, then:[s], else:e?[e]:[], line:t.line};
  }
  parseFor(){
    const t=this.expect("FOR");
    const nm=this.expect("IDENT","a name for the traveler");
    this.expect("IN","IN");
    const iter=this.parseExpr();
    let body;
    this.loopDepth++;
    try{
      if(this.at("NEWLINE")){                                 // block form; ENDFOR optional (legacy runs to END)
        this.next();
        body=this.parseStatements(new Set(["ENDFOR","END","EOF"]));
        if(this.at("ENDFOR")) this.next();
      }else{
        body=[this.parseStatement()];                          // inline form
      }
    }finally{ this.loopDepth--; }
    return {kind:"For", var:nm.value, iter, body, line:t.line};
  }
  parseWhile(){
    const t=this.expect("WHILE");
    const cond=this.parseExpr();
    this.expect("DO","DO");
    let body;
    this.loopDepth++;
    try{
      if(this.at("NEWLINE")){
        this.next();
        body=this.parseStatements(new Set(["ENDWHILE","EOF"]));
        this.expect("ENDWHILE","ENDWHILE");
      }else{
        body=[this.parseStatement()];
      }
    }finally{ this.loopDepth--; }
    return {kind:"While", cond, body, line:t.line};
  }
  parseTry(){
    const t=this.expect("TRY");
    if(!this.at("NEWLINE")) throw new GodError(
      "TRY opens a block: place its works on the following lines, then CATCH ... ENDTRY.", t.line, t.col);
    this.next();
    const tryB=this.parseStatements(new Set(["CATCH","EOF"]));
    this.expect("CATCH","CATCH");
    let name="ERROR";                                          // the error's plain message is bound here
    if(this.at("IDENT")) name=this.next().value;
    if(this.at("NEWLINE")) this.next();
    const catchB=this.parseStatements(new Set(["ENDTRY","EOF"]));
    this.expect("ENDTRY","ENDTRY");
    return {kind:"Try", try:tryB, catch:catchB, name, line:t.line};
  }
  parseRite(){
    const t=this.expect("DEFINE");
    this.expect("RITE","RITE");
    const nm=this.expect("IDENT","a rite name");
    this.expect("LPAREN","'('");
    const params=[];
    if(!this.at("RPAREN")){
      params.push(this.expect("IDENT","a parameter name").value);
      while(this.at("COMMA")){ this.next(); params.push(this.expect("IDENT","a parameter name").value); }
    }
    this.expect("RPAREN","')'");
    let bs=this.i;
    while(this.t[bs]&&this.t[bs].type==="NEWLINE") bs++;
    const bodyStartLine=this.t[bs]?this.t[bs].line:this.peek().line;
    const body=this.parseStatements(new Set(["END","EOF"])); // works inline too: `DEFINE RITE f(x) SEAL x END RITE`
    let bodyEndLine=bodyStartLine;
    for(let k=this.i-1;k>=0;k--){
      const tk=this.t[k];
      if(tk.type!=="NEWLINE"&&tk.type!=="EOF"){ bodyEndLine=tk.line; break; }
    }
    // The rite's own words, for the Spirit to discern at invocation.
    const bodyText=this.srcLines?this.srcLines.slice(bodyStartLine-1,bodyEndLine).join("\n"):"";
    this.expect("END","END RITE"); this.expect("RITE","RITE");
    return {kind:"RiteDef", name:nm.value, params, body, bodyText, line:t.line};
  }
  parseArgs(){
    const args=[];
    if(!this.at("RPAREN")){
      args.push(this.parseExpr());
      while(this.at("COMMA")){ this.next(); args.push(this.parseExpr()); }
    }
    this.expect("RPAREN","')'");
    return args;
  }

  /* Expression precedence (low → high):
     or → and → not → comparison → additive → multiplicative → unary → primary */
  parseExpr(){ return this.parseOr(); }
  parseOr(){
    let l=this.parseAnd();
    while(this.at("OR")){ const t=this.next(); l={kind:"Binary", op:"or", left:l, right:this.parseAnd(), line:t.line}; }
    return l;
  }
  parseAnd(){
    let l=this.parseNot();
    while(this.at("AND")){ const t=this.next(); l={kind:"Binary", op:"and", left:l, right:this.parseNot(), line:t.line}; }
    return l;
  }
  parseNot(){
    if(this.at("NOT")){ const t=this.next(); return {kind:"Unary", op:"not", operand:this.parseNot(), line:t.line}; }
    return this.parseComparison();
  }
  parseComparison(){
    let l=this.parseAdditive();
    for(;;){
      const t=this.peek();
      let op=null;
      if(t.type==="IS"){ this.next(); if(this.at("NOT")){ this.next(); op="!="; } else op="=="; }
      else if(t.type==="EQ"){ this.next(); op="=="; }
      else if(t.type==="NEQ"){ this.next(); op="!="; }
      else if(t.type==="LT"){ this.next(); op="<"; }
      else if(t.type==="GT"){ this.next(); op=">"; }
      else if(t.type==="LTE"){ this.next(); op="<="; }
      else if(t.type==="GTE"){ this.next(); op=">="; }
      else break;
      l={kind:"Binary", op, left:l, right:this.parseAdditive(), line:t.line};
    }
    return l;
  }
  parseAdditive(){
    let l=this.parseMultiplicative();
    while(this.at("PLUS")||this.at("MINUS")){
      const t=this.next();
      l={kind:"Binary", op:t.value, left:l, right:this.parseMultiplicative(), line:t.line};
    }
    return l;
  }
  parseMultiplicative(){
    let l=this.parseUnary();
    while(this.at("STAR")||this.at("SLASH")||this.at("PERCENT")){
      const t=this.next();
      l={kind:"Binary", op:t.value, left:l, right:this.parseUnary(), line:t.line};
    }
    return l;
  }
  parseUnary(){
    if(this.at("MINUS")){ const t=this.next(); return {kind:"Unary", op:"-", operand:this.parseUnary(), line:t.line}; }
    if(this.at("NOT")){ const t=this.next(); return {kind:"Unary", op:"not", operand:this.parseUnary(), line:t.line}; }
    return this.parsePostfix();
  }
  parsePostfix(){
    let n=this.parsePrimary();
    while(this.at("LBRACKET")){
      const t=this.next();
      const ix=this.parseExpr();
      this.expect("RBRACKET","']'");
      n={kind:"Index", obj:n, index:ix, line:t.line};
    }
    return n;
  }
  parsePrimary(){
    const t=this.peek();
    switch(t.type){
      case "NUMBER":
        this.next(); return {kind:"Literal", value:t.value, line:t.line};
      case "STRING":
        this.next();
        if(t.value.includes("{")||t.value.includes("}}")) return this.parseInterp(t);
        return {kind:"Literal", value:t.value, line:t.line};
      case "TRUE":  this.next(); return {kind:"Literal", value:true, line:t.line};
      case "FALSE": this.next(); return {kind:"Literal", value:false, line:t.line};
      case "IDENT":
        if(this.peek2().type==="LPAREN"){
          this.next(); this.next();
          return {kind:"Call", name:t.value, args:this.parseArgs(), line:t.line};
        }
        this.next(); return {kind:"Ident", name:t.value, line:t.line};
      case "LPAREN":
        this.next(); const e=this.parseExpr(); this.expect("RPAREN","')'"); return e;
      case "LBRACKET": {
        this.next(); const items=[];
        if(!this.at("RBRACKET")){
          items.push(this.parseExpr());
          while(this.at("COMMA")){ this.next(); items.push(this.parseExpr()); }
        }
        this.expect("RBRACKET","']'");
        return {kind:"List", items, line:t.line};
      }
      default:
        throw new GodError("Unexpected '"+t.value+"'. A value was expected here (a number, \"word\", name, or list).", t.line, t.col);
    }
  }
  // "grace upon {name}": {expr} breathes a value into the words; {{ and }} write a plain brace.
  parseInterp(t){
    const src=t.value, parts=[]; let buf="", i=0; const n=src.length;
    while(i<n){
      const ch=src[i];
      if(ch==="{"&&src[i+1]==="{"){ buf+="{"; i+=2; continue; }
      if(ch==="}"&&src[i+1]==="}"){ buf+="}"; i+=2; continue; }
      if(ch==="{"){
        const end=this.interpEnd(src,i,t);
        const inner=src.slice(i+1,end);
        if(!inner.trim()) throw new GodError("empty braces breathe nothing into the string. Place a name or an expression between '{' and '}', or write '{{}}' for plain braces.", t.line);
        if(buf){ parts.push(buf); buf=""; }
        const toks=lex(inner).filter(x=>x.type!=="NEWLINE"&&x.type!=="EOF");
        toks.push({type:"EOF", value:"", line:t.line, col:1});
        const sub=new Parser(toks);
        const e=sub.parseExpr();
        if(sub.peek().type!=="EOF") throw new GodError("the blessing between '{' and '}' could not be understood. Only one expression may dwell there.", t.line);
        parts.push(e);
        i=end+1; continue;
      }
      buf+=ch; i++;
    }
    if(buf) parts.push(buf);
    return {kind:"Interp", parts, line:t.line};
  }
  interpEnd(src,start,t){
    let depth=0, inStr=false, i=start; const n=src.length;
    while(i<n){
      const c=src[i];
      if(inStr){ if(c==="\\"){ i+=2; continue; } if(c==='"') inStr=false; }
      else if(c==='"') inStr=true;
      else if(c==="{") depth++;
      else if(c==="}"){ depth--; if(depth===0) return i; }
      i++;
    }
    throw new GodError("an opening '{' breathes a blessing that was never sealed. Close it with '}' or write '{{' for a plain brace.", t.line);
  }
}

/* ---------------- 3. VALUES & HELPERS ---------------- */
// The Symbol rule: an unbound name evaluates to a Sym — its own name as a word.
class Sym{ constructor(name){ this.name=name; } }
class Contract{
  constructor(name){ this.name=name; this.alive=false; this.blessed=false; this.anointed=false; }
}
class Rite{ constructor(name,params,body,closure,bodyText){ this.name=name; this.params=params; this.body=body; this.closure=closure; this.bodyText=bodyText||""; } }

class Env{
  constructor(parent){ this.parent=parent||null; this.map=new Map(); }
  define(n,v){ this.map.set(n,v); }
  has(n){ return this.map.has(n) || (this.parent ? this.parent.has(n) : false); }
  get(n){
    if(this.map.has(n)) return this.map.get(n);
    if(this.parent) return this.parent.get(n);
    return new Sym(n);                                        // the Symbol rule
  }
}

function typeName(v){
  if(v===null||v===undefined) return "void";
  if(typeof v==="boolean") return "boolean";
  if(typeof v==="number") return "number";
  if(typeof v==="string") return "string";
  if(v instanceof Sym) return "symbol";
  if(Array.isArray(v)) return "list";
  if(v instanceof Contract) return "contract";
  if(v instanceof Rite) return "rite";
  if(v!==null&&typeof v==="object"&&!Array.isArray(v)) return "map";
  return "unknown";
}
function stringify(v){
  if(v===null||v===undefined) return "void";
  if(typeof v==="boolean") return v?"true":"false";
  if(typeof v==="number"){
    if(Number.isInteger(v)) return String(v);
    if(Math.abs(v-Math.round(v))<1e-6) return String(Math.round(v));  // 12.00000001 → 12
    return String(v);
  }
  if(typeof v==="string") return v;
  if(v instanceof Sym) return v.name;
  if(v instanceof Contract) return 'contract("'+v.name+'")';
  if(Array.isArray(v)) return "["+v.map(stringify).join(", ")+"]";
  if(v instanceof Rite) return "<rite "+v.name+">";
  if(isPlainMap(v)) return "{"+Object.keys(v).map(k=>k+": "+stringify(v[k])).join(", ")+"}";
  return String(v);
}
function truthy(v){
  if(v===null||v===undefined) return false;
  if(typeof v==="boolean") return v;
  if(typeof v==="number") return v!==0;
  if(typeof v==="string") return v.length>0;
  if(v instanceof Sym) return true;                           // a named spirit is always truthy
  if(Array.isArray(v)) return v.length>0;
  return true;                                                // contracts and rites exist, therefore are
}
function txt(v){ return v instanceof Sym ? v.name : v; }      // word text of string-or-symbol
function isEqual(a,b){
  if(a instanceof Sym && b instanceof Sym) return a.name===b.name;
  if(a instanceof Sym && typeof b==="string") return a.name===b;
  if(typeof a==="string" && b instanceof Sym) return a===b.name;
  if(a instanceof Contract && b instanceof Contract) return a.name===b.name;
  if(Array.isArray(a) && Array.isArray(b))
    return a.length===b.length && a.every((x,i)=>isEqual(x,b[i]));
  if(typeof a==="number" && typeof b==="number") return a===b;
  return a===b;
}
function addVals(a,b,line){
  if(typeof a==="number" && typeof b==="number") return a+b;
  const sa=txt(a), sb=txt(b);
  if(typeof sa==="string" && typeof sb==="string") return sa+sb;
  if(Array.isArray(a) && Array.isArray(b)) return a.concat(b);
  throw new GodError("cannot join "+typeName(a)+" and "+typeName(b)+
    " with '+'. Join numbers with numbers, words with words, lists with lists.", line);
}
function cmpVals(op,a,b,line){
  const ta=txt(a), tb=txt(b);
  const num = typeof a==="number" && typeof b==="number";
  const str = typeof ta==="string" && typeof tb==="string";
  if(!num && !str)
    throw new GodError("cannot weigh "+typeName(a)+" against "+typeName(b)+". Only numbers or words may be compared.", line);
  const x=num?a:ta, y=num?b:tb;
  switch(op){
    case "<":  return x<y;
    case ">":  return x>y;
    case "<=": return x<=y;
    case ">=": return x>=y;
  }
}

/* ---------------- 4. BUILT-INS ---------------- */
const BUILTINS={
  LEN:{min:1,max:1,fn(a,line){const x=a[0];
    if(typeof x==="string"||x instanceof Sym) return txt(x).length;
    if(Array.isArray(x)) return x.length;
    throw new GodError("LEN cannot measure a "+typeName(x)+". Only words and lists have length.",line);}},
  STR:{min:1,max:1,fn(a){return stringify(a[0]);}},
  NUM:{min:1,max:1,fn(a,line){const x=a[0];
    if(typeof x==="number") return x;
    if(typeof x==="string"||x instanceof Sym){
      const s=txt(x).trim();
      if(s!=="" && !isNaN(Number(s))) return Number(s);
      throw new GodError('cannot transmute "'+txt(x)+'" into a number.',line);
    }
    throw new GodError("NUM cannot transmute a "+typeName(x)+" into a number.",line);}},
  TYPE:{min:1,max:1,fn(a){return typeName(a[0]);}},
  RANDOM:{min:1,max:1,fn(a,line){const n=a[0];
    if(typeof n!=="number"||n<1) throw new GodError("RANDOM needs a positive number of lots to cast.",line);
    return Math.floor(Math.random()*Math.floor(n));}},
  RANGE:{min:1,max:2,fn(a,line){
    const lo=a.length===2?a[0]:0, hi=a.length===2?a[1]:a[0];
    if(typeof lo!=="number"||typeof hi!=="number"||!Number.isInteger(lo)||!Number.isInteger(hi))
      throw new GodError("RANGE needs whole numbers.",line);
    const out=[]; for(let i=lo;i<hi;i++) out.push(i); return out;}},
  PUSH:{min:2,max:2,fn(a,line){
    if(!Array.isArray(a[0])) throw new GodError("PUSH needs a list, not "+typeName(a[0])+".",line);
    return a[0].concat([a[1]]);}},
  UPPER:{min:1,max:1,fn(a,line){
    if(typeof a[0]!=="string"&&!(a[0] instanceof Sym)) throw new GodError("UPPER needs a word, not "+typeName(a[0])+".",line);
    return txt(a[0]).toUpperCase();}},
  LOWER:{min:1,max:1,fn(a,line){
    if(typeof a[0]!=="string"&&!(a[0] instanceof Sym)) throw new GodError("LOWER needs a word, not "+typeName(a[0])+".",line);
    return txt(a[0]).toLowerCase();}},
  SPLIT:{min:2,max:2,fn(a,line){
    if(typeof a[0]!=="string"&&!(a[0] instanceof Sym)) throw new GodError("SPLIT needs a word, not "+typeName(a[0])+".",line);
    if(typeof a[1]!=="string"&&!(a[1] instanceof Sym)) throw new GodError("SPLIT needs a word to split upon.",line);
    return txt(a[0]).split(txt(a[1]));}},
  JOIN:{min:2,max:2,fn(a,line){
    if(!Array.isArray(a[0])) throw new GodError("JOIN needs a list, not "+typeName(a[0])+".",line);
    if(typeof a[1]!=="string"&&!(a[1] instanceof Sym)) throw new GodError("JOIN needs a word to join with.",line);
    return a[0].map(stringify).join(txt(a[1]));}},
  BEHOLD:{min:0,max:0,fn(){return new Date().toISOString();}},
  CONSULT:{min:1,max:1,fn(a,line){const q=a[0];
    if(typeof q!=="string"&&!(q instanceof Sym))
      throw new GodError("CONSULT needs a question as a word, not "+typeName(q)+".",line);
    // No Spirit is bound in the browser, so the oracle answers with the
    // engine's own gentle silence rather than inventing counsel.
    return "The Spirit is silent on this question. Breathe, and ask again.";}},
  REVERSE:{min:1,max:1,fn(a,line){const x=a[0];
    if(typeof x==="string") return [...x].reverse().join("");
    if(x instanceof Sym) return [...x.name].reverse().join("");
    if(Array.isArray(x)) return x.slice().reverse();
    throw new GodError("REVERSE cannot turn back a "+typeName(x)+".",line);}},
};

// PROPHESY: a simple keyword-reading oracle (the full SpiritEngine lives in Python).
function prophesy(text){
  const t=(text||"").toLowerCase();
  const omens=[];
  const has=(...ws)=>ws.some(w=>t.indexOf(w)!==-1);
  if(has("harvest","wheat","field","rain","crop","seed"))   omens.push("the fields shall yield in abundance");
  if(has("future","tomorrow","ahead","destiny","fate"))     omens.push("the days ahead are numbered, and they are known");
  if(has("code","creation","build","program","creator"))    omens.push("your creation shall compile in the heavens");
  if(has("war","battle","enemy","fight"))                  omens.push("the battle belongs to the Lord. Stand still and see");
  if(has("journey","path","road","way","walk"))             omens.push("your path is made straight before you");
  if(has("love","heart","beloved"))                        omens.push("love shall find you in due season");
  if(has("bless","favor","grace"))                         omens.push("blessings shall overflow like the rivers of Eden");
  if(has("money","wealth","gold","rich","prosper"))        omens.push("prosperity comes to the diligent hand");
  if(omens.length===0) omens.push("the Spirit is quiet on this matter. BREATHE, and try again");
  return "🔮 Thus saith the interpreter: "+omens.join("; ")+". Amen.";
}

/* ---------------- 5. INTERPRETER ---------------- */
// Simple synchronous hash for the in-browser simulated chain adapter. It stands
// in for SHA-256 the way the covenant ledger's djb2 does: same receipt shape a
// real chain adapter would return, tamper-evident within a run.
function simpleHash(s){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let i=0;i<s.length;i++){
    const ch=s.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (h2>>>0).toString(16).padStart(8,"0")+(h1>>>0).toString(16).padStart(8,"0");
}
// Canonical JSON: stable key order, no whitespace (mirrors the engine's chain hashing).
function canonical(v){
  if(v===null||v===undefined) return "null";
  if(Array.isArray(v)) return "["+v.map(canonical).join(",")+"]";
  if(typeof v==="object"){
    const keys=Object.keys(v).sort();
    return "{"+keys.map(k=>JSON.stringify(k)+":"+canonical(v[k])).join(",")+"}";
  }
  return JSON.stringify(v);
}
function isPlainMap(v){
  return v!==null&&typeof v==="object"&&!Array.isArray(v)&&
    !(v instanceof Sym)&&!(v instanceof Contract)&&!(v instanceof Rite);
}
class Interpreter{
  constructor(){ this.env=new Env(); this.output=[]; this.blocks=[]; this.imported=new Set();
    this.intents={};            // rite name -> declared intent text
    this.anchorBlocks=[];       // the in-browser simulated anchor chain
  }
  print(s){ this.output.push(String(s)); }

  run(source){
    const parser=new Parser(lex(source));
    parser.srcLines=source.split("\n");      // the rite's own words, for intent discernment
    const prog=parser.parse();
    try{ this.execBlock(prog.statements,this.env); }
    catch(e){
      if(e instanceof AscendSignal){ this.print("🕊 Creation ascended in peace."); return; }
      if(e instanceof ReturnSignal) throw new GodError("RETURN may only be spoken within a rite.",null);
      throw e;
    }
  }
  execBlock(stmts,env){ for(const s of stmts) this.exec(s,env); }

  mustBeBound(env,name,verb,line){
    if(!env.has(name)) throw new GodError("there is no "+name+" to "+verb+". Declare it first.",line);
    return env.get(name);
  }
  // In-memory covenant chain (a djb2 hash stands in for sha256 here).
  seal(record){
    const prev=this.blocks.length?this.blocks[this.blocks.length-1].hash:"GENESIS";
    const ts=new Date().toISOString();
    const raw=this.blocks.length+"|"+ts+"|"+record+"|"+prev;
    let h=5381;
    for(let i=0;i<raw.length;i++) h=((h<<5)+h+raw.charCodeAt(i))>>>0;
    const block={index:this.blocks.length,timestamp:ts,record,prev,hash:h.toString(16).padStart(8,"0")};
    this.blocks.push(block);
    return block;
  }
  // ANCHOR(expr [, chain]) — anchor a value's hash on a chain and return the
  // receipt {chain, anchor_hash, height, timestamp, payload_hash}. The only
  // chain bound in the browser is "simulated": an ephemeral in-memory chain
  // that vanishes when the run ends, mirroring the engine's deny-by-default
  // sandbox. Same receipt shape a real chain adapter would return.
  builtinAnchor(args,line){
    if(args.length<1||args.length>2)
      throw new GodError("ANCHOR expects 1–2 offering(s), but received "+args.length+".",line);
    const value=args[0];
    let chainName="simulated";
    if(args.length===2){
      const nm=args[1];
      if(typeof nm!=="string"&&!(nm instanceof Sym))
        throw new GodError("ANCHOR needs the chain's name as a word, not "+typeName(nm)+".",line);
      chainName=txt(nm);
    }
    if(chainName!=="simulated")
      throw new GodError("The chain '"+chainName+"' is unknown to the heavens. The known chains are: simulated.",line);
    const payloadHash=simpleHash(stringify(value));
    const blocks=this.anchorBlocks;
    const index=blocks.length;
    const prev=index?blocks[index-1].hash:"GENESIS";
    const ts=new Date().toISOString();
    const record={payload_hash:payloadHash};
    const hash=simpleHash(canonical({index:index,timestamp:ts,record:record,prev_hash:prev}));
    blocks.push({index:index,timestamp:ts,record:record,prev_hash:prev,hash:hash});
    const receipt={chain:"simulated",anchor_hash:hash,height:index,timestamp:ts,payload_hash:payloadHash};
    this.print("[ANCHOR] Anchored on simulated · height "+index+" · "+hash.slice(0,8)+" ⚓");
    return receipt;
  }
  // Discern a rite's actual intent at invocation and counsel on divergence.
  // The run is never failed over drift: the Spirit counsels, it does not condemn.
  discernIntent(rite,declared){
    const discerned=spiritClassify(rite.bodyText||"");
    if(spiritAligned(declared,discerned))
      this.print('[INTENT] '+rite.name+' walks in its declared intent: "'+declared+'" 🕊');
    else
      this.print('[WARNING] '+rite.name+' drifts from its declared intent. Declared: "'+declared+
        '". Discerned: "'+discerned.intent+'". The Spirit counsels; it does not condemn.');
  }

  exec(n,env){
    switch(n.kind){
      case "Creation": this.execBlock(n.statements,env); break;
      case "Declare":  env.define(n.name,this.eval(n.value,env)); break;
      case "DeclareIntent":
        this.intents[n.rite]=n.text;
        this.print('[INTENT] '+n.rite+' now carries the intent: "'+n.text+'" 🕊');
        break;
      case "Breathe": {
        const v=this.mustBeBound(env,n.name,"breathe into",n.line);
        if(v instanceof Contract) v.alive=true;
        this.print("[BREATHE] Life breathed into "+n.name+" 🕊"); break;
      }
      case "Reveal":   this.print(stringify(this.eval(n.expr,env))); break;
      case "Prophesy": this.print(prophesy(n.text)); break;
      case "Ascend":   throw new AscendSignal();
      case "Reflect": {
        const seen=new Map(); let e=env;
        while(e){ for(const [k,v] of e.map) if(!seen.has(k)) seen.set(k,v); e=e.parent; }
        if(seen.size===0) this.print("(the heavens are empty — nothing is declared)");
        for(const [k,v] of seen) this.print(k+" = "+stringify(v));
        break;
      }
      case "Bless": {
        const v=this.mustBeBound(env,n.name,"bless",n.line);
        if(v instanceof Contract) v.blessed=true;
        this.print("[BLESS] "+n.name+" is blessed ✝"); break;
      }
      case "Anoint": {
        const v=this.mustBeBound(env,n.name,"anoint",n.line);
        if(v instanceof Contract) v.anointed=true;
        this.print("[ANOINT] "+n.name+" is anointed 🕯"); break;
      }
      case "Seal": {
        const b=this.seal(stringify(this.eval(n.expr,env)));
        this.print("[SEAL] Covenant sealed · block "+b.index+" · "+b.hash+" 🔒"); break;
      }
      case "Testify":
        if(truthy(this.eval(n.expr,env))) this.print("[TESTIFY] It is true. ✝");
        else throw new GodError("testimony failed — the heavens are silent on this matter.",n.line);
        break;
      case "If":
        this.execBlock(truthy(this.eval(n.cond,env))?n.then:n.else, env); break;
      case "For": {
        const it=this.eval(n.iter,env);
        let items;
        if(Array.isArray(it)) items=it;
        else if(typeof it==="string") items=[...it];
        else if(it instanceof Sym) items=[...it.name];
        else throw new GodError("cannot journey through "+typeName(it)+" — FOR needs a list or a word.",n.line);
        const had=env.map.has(n.var), old=had?env.map.get(n.var):undefined;
        for(const item of items){
          env.define(n.var,item);
          try{ this.execBlock(n.body,env); }
          catch(e){
            if(e instanceof ContinueSignal) continue;          // the condition is weighed again for the next turn
            if(e instanceof BreakSignal) break;                // the cycle ends at once
            throw e;
          }
        }
        if(had) env.define(n.var,old); else env.map.delete(n.var);   // restore the traveler's name
        break;
      }
      case "While": {
        let guard=100000;
        while(truthy(this.eval(n.cond,env))){
          if(guard--<=0) throw new GodError("the cycle is endless. WHILE has turned 100,000 times without rest.",n.line);
          try{ this.execBlock(n.body,env); }
          catch(e){
            if(e instanceof ContinueSignal) continue;
            if(e instanceof BreakSignal) break;
            throw e;
          }
        }
        break;
      }
      case "Try": {
        // Only GodError is caught: RETURN still returns from its rite, ASCEND still
        // ends the run in peace, and BREAK/CONTINUE still reach their loop. Errors in
        // the CATCH body are outside this shelter, so they rise outward normally.
        try{ this.execBlock(n.try,env); }
        catch(e){
          if(e instanceof GodError){
            env.define(n.name,e.message);                     // the error's plain message, bound for the CATCH
            this.execBlock(n.catch,env);
          }else throw e;
        }
        break;
      }
      case "Break":    throw new BreakSignal();
      case "Continue": throw new ContinueSignal();
      case "RiteDef": env.define(n.name,new Rite(n.name,n.params,n.body,env,n.bodyText)); break;
      case "Return":  throw new ReturnSignal(n.expr?this.eval(n.expr,env):null);
      case "Import": {
        const key=n.path.toLowerCase().replace(/\.god$/,"");
        const src=SCROLLS[key];
        if(!src) throw new GodError('no scroll named "'+n.path+'" rests in the temple library — try: math, strings, lists, time, prophecy, covenant.',n.line);
        if(this.imported.has(key)) break;                            // each scroll is read once
        this.imported.add(key);
        this.execBlock(new Parser(lex(src)).parse().statements,env);
        break;
      }
      case "ExprStmt": this.eval(n.expr,env); break;                 // value discarded
      default: throw new GodError("the interpreter encountered an unknown form.",n.line);
    }
  }

  eval(n,env){
    switch(n.kind){
      case "Literal": return n.value;
      case "Interp":  return n.parts.map(p=>typeof p==="string"?p:stringify(this.eval(p,env))).join("");
      case "Ident":   return env.get(n.name);
      case "List":    return n.items.map(i=>this.eval(i,env));
      case "Index":   return this.evalIndex(n,env);
      case "Unary": {
        const v=this.eval(n.operand,env);
        if(n.op==="not") return !truthy(v);
        if(typeof v!=="number") throw new GodError("the minus sign falls only upon numbers, not "+typeName(v)+".",n.line);
        return -v;
      }
      case "Binary": {
        const l=this.eval(n.left,env);
        if(n.op==="and") return truthy(l)?this.eval(n.right,env):l;   // short-circuit, like Python
        if(n.op==="or")  return truthy(l)?l:this.eval(n.right,env);
        return this.evalBinary(n.op,l,this.eval(n.right,env),n.line);
      }
      case "Call": return this.evalCall(n,env);
    }
    throw new GodError("the interpreter encountered an unknown value.",n.line);
  }
  evalBinary(op,l,r,line){
    switch(op){
      case "+": return addVals(l,r,line);
      case "-": case "*": case "/": case "%": {
        if(typeof l!=="number"||typeof r!=="number")
          throw new GodError("'"+op+"' reckons only numbers — not "+typeName(l)+" and "+typeName(r)+".",line);
        if((op==="/"||op==="%")&&r===0)
          throw new GodError("cannot divide by nothing — the void has no portions.",line);
        return op==="-"?l-r : op==="*"?l*r : op==="/"?l/r : l%r;
      }
      case "==": return isEqual(l,r);
      case "!=": return !isEqual(l,r);
      case "<": case ">": case "<=": case ">=": return cmpVals(op,l,r,line);
    }
    throw new GodError("unknown reckoning '"+op+"'.",line);
  }
  evalIndex(n,env){
    const o=this.eval(n.obj,env), ix=this.eval(n.index,env);
    if(isPlainMap(o)){
      const key=ix instanceof Sym?ix.name:ix;
      if(typeof key!=="string")
        throw new GodError("a map is indexed by a word, not "+stringify(ix)+".",n.line);
      if(!Object.prototype.hasOwnProperty.call(o,key))
        throw new GodError("The map holds no '"+key+"'. Its keys are: "+Object.keys(o).join(", ")+".",n.line);
      return o[key];
    }
    if(typeof ix!=="number"||!Number.isInteger(ix))
      throw new GodError("an index must be a whole number, not "+stringify(ix)+".",n.line);
    const s=o instanceof Sym?o.name:o;
    if(Array.isArray(o)||typeof s==="string"){
      const len=Array.isArray(o)?o.length:s.length;
      let i=ix; if(i<0) i+=len;
      if(i<0||i>=len) throw new GodError("index "+ix+" is beyond the edge — the "+
        (Array.isArray(o)?"list":"word")+" holds only "+len+".",n.line);
      return Array.isArray(o)?o[i]:s[i];
    }
    throw new GodError("cannot index into "+typeName(o)+". Only lists and words may be indexed.",n.line);
  }
  evalCall(n,env){
    const up=n.name.toUpperCase();
    const args=n.args.map(a=>this.eval(a,env));
    if(up==="CONTRACT"){
      if(args.length!==1) throw new GodError("contract() names exactly one covenant, but received "+args.length+".",n.line);
      if(typeof args[0]!=="string"&&!(args[0] instanceof Sym))
        throw new GodError("a covenant must be named with a word, not "+typeName(args[0])+".",n.line);
      return new Contract(txt(args[0]));
    }
    if(up==="ANCHOR") return this.builtinAnchor(args,n.line);
    const b=BUILTINS[up];
    if(b){
      if(args.length<b.min||args.length>b.max){
        const want=b.min===b.max?""+b.min:b.min+"–"+b.max;
        throw new GodError(n.name+" expects "+want+" offering(s), but received "+args.length+".",n.line);
      }
      return b.fn(args,n.line);
    }
    const rite=this.findRite(env,n.name);
    if(rite) return this.callRite(rite,args,n.line);
    if(env.has(n.name))
      throw new GodError("'"+n.name+"' is a "+typeName(env.get(n.name))+", not a rite that may be invoked.",n.line);
    throw new GodError("no such rite '"+n.name+"' — it is not written in the scrolls.",n.line);
  }
  findRite(env,name){
    for(const k of [name,name.toUpperCase()]){
      if(env.has(k)){ const v=env.get(k); if(v instanceof Rite) return v; }
    }
    return null;
  }
  callRite(rite,args,line){
    if(args.length!==rite.params.length)
      throw new GodError("rite "+rite.name+" expects "+rite.params.length+" offering(s), but received "+args.length+".",line);
    const declared=this.intents[rite.name];
    if(declared!==undefined) this.discernIntent(rite,declared);
    const cenv=new Env(rite.closure);
    rite.params.forEach((p,i)=>cenv.define(p,args[i]));
    try{ this.execBlock(rite.body,cenv); }
    catch(e){
      if(e instanceof ReturnSignal) return e.value;
      if(e instanceof BreakSignal||e instanceof ContinueSignal)
        throw new GodError((e instanceof BreakSignal?"BREAK":"CONTINUE")+
          " cannot cross the threshold of a rite. It may only release a loop within rite '"+rite.name+"' itself.",line);
      throw e;
    }
    return null;                                                     // a rite with no RETURN yields void
  }
}

/* ---------------- 6. SCROLLS (stdlib, written in God Code itself) ---------------- */
const SCROLLS={
math:
`# The Math Scroll — divine reckonings
DEFINE RITE SQRT(x)
    DECLARE guess AS x / 2
    IF guess IS 0 THEN
        RETURN 0
    ENDIF
    WHILE ABS(guess * guess - x) > 0.0001 DO
        DECLARE guess AS (guess + x / guess) / 2
    ENDWHILE
    RETURN guess
END RITE

DEFINE RITE POW(b, e)
    DECLARE result AS 1
    DECLARE i AS 0
    WHILE i < e DO
        DECLARE result AS result * b
        DECLARE i AS i + 1
    ENDWHILE
    RETURN result
END RITE

DEFINE RITE ABS(x)
    IF x < 0 THEN
        RETURN 0 - x
    ENDIF
    RETURN x
END RITE

DEFINE RITE MIN(a, b)
    IF a < b THEN
        RETURN a
    ENDIF
    RETURN b
END RITE

DEFINE RITE MAX(a, b)
    IF a > b THEN
        RETURN a
    ENDIF
    RETURN b
END RITE

DEFINE RITE FACTORIAL(n)
    DECLARE result AS 1
    DECLARE i AS 2
    WHILE i <= n DO
        DECLARE result AS result * i
        DECLARE i AS i + 1
    ENDWHILE
    RETURN result
END RITE

DEFINE RITE IS_EVEN(n)
    RETURN n % 2 IS 0
END RITE`,
strings:
`# The Strings Scroll — the Word, shaped
DEFINE RITE SHOUT(s)
    RETURN UPPER(s) + "!"
END RITE

DEFINE RITE WHISPER(s)
    RETURN LOWER(s)
END RITE

DEFINE RITE WORDS(s)
    RETURN SPLIT(s, " ")
END RITE

DEFINE RITE CHARS(s)
    RETURN SPLIT(s, "")
END RITE

DEFINE RITE FIRST(s)
    RETURN s[0]
END RITE

DEFINE RITE LAST(s)
    RETURN s[LEN(s) - 1]
END RITE`,
lists:
`# The Lists Scroll — multitudes, ordered
DEFINE RITE SUM(xs)
    DECLARE total AS 0
    FOR x IN xs
        DECLARE total AS total + x
    ENDFOR
    RETURN total
END RITE

DEFINE RITE AVG(xs)
    RETURN SUM(xs) / LEN(xs)
END RITE

DEFINE RITE CONTAINS(xs, x)
    FOR item IN xs
        IF item IS x THEN
            RETURN TRUE
        ENDIF
    ENDFOR
    RETURN FALSE
END RITE

DEFINE RITE SECOND(xs)
    RETURN xs[1]
END RITE

DEFINE RITE TAIL(xs)
    DECLARE rest AS []
    DECLARE i AS 1
    WHILE i < LEN(xs) DO
        DECLARE rest AS PUSH(rest, xs[i])
        DECLARE i AS i + 1
    ENDWHILE
    RETURN rest
END RITE

DEFINE RITE COUNT(xs, x)
    DECLARE n AS 0
    FOR item IN xs
        IF item IS x THEN
            DECLARE n AS n + 1
        ENDIF
    ENDFOR
    RETURN n
END RITE`,
time:
`# The Time Scroll — seasons and appointed times
DEFINE RITE NOW()
    RETURN BEHOLD()
END RITE

DEFINE RITE TODAY()
    RETURN FIRST(SPLIT(BEHOLD(), "T"))
END RITE`,
prophecy:
`# The Prophecy Scroll — casting lots
DEFINE RITE PROPHESY_NUMBER(n)
    RETURN RANDOM(n)
END RITE

DEFINE RITE CAST_LOTS()
    RETURN RANDOM(2)
END RITE

DEFINE RITE CHOOSE(xs)
    RETURN xs[RANDOM(LEN(xs))]
END RITE`,
covenant:
`# The Covenant Scroll — bindings of promise
DEFINE RITE NEW_COVENANT(name)
    RETURN contract(name)
END RITE

DEFINE RITE SEAL_COVENANT(c)
    SEAL c
END RITE`
};

/* ---------------- 7b. Share links (dependency-free, testable in Node) ---------------- */
function b64urlEncode(s){
  const bytes=new TextEncoder().encode(s);
  let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(p){
  let b64=String(p).replace(/-/g,"+").replace(/_/g,"/");
  while(b64.length%4) b64+="=";
  const bin=atob(b64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

/* ---------------- 8. UI (browser only) ---------------- */
if(typeof document!=="undefined"){
  const editor=document.getElementById("editor");
  const hl=document.getElementById("highlight");
  const hlcode=document.getElementById("hlcode");
  const gutter=document.getElementById("gutter");
  const out=document.getElementById("out");
  const samplesSel=document.getElementById("samples");

  // Regex tokenizer for the overlay highlighter (same keyword set as the
  // lexer, plus the active tongue's words).
  function tokReFor(src){
    let kws=[...KEYWORDS,"CONSULT","ANCHOR","INTENT","ON"];
    const t=TONGUES[detectTongue(src)];
    if(t) kws=kws.concat(Object.keys(t.aliases));
    return new RegExp(
      "(#[^\\n]*)"+                       // comment
      '|("(?:[^"\\\\\\n]|\\\\.)*\\"?")'+    // string (tolerates unterminated while typing)
      "|(\\b\\d+(?:\\.\\d+)?\\b)"+        // number
      "|(\\b(?:"+kws.join("|")+")\\b)",  // keyword
      "gi");
  }
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function highlight(src){
    let res="", last=0, m;
    const TOK_RE=tokReFor(src);
    TOK_RE.lastIndex=0;
    while((m=TOK_RE.exec(src))){
      res+=esc(src.slice(last,m.index));
      const tok=m[0];
      const cls=m[1]?"c-com":m[2]?"c-str":m[3]?"c-num":"c-kw";
      res+='<span class="'+cls+'">'+esc(tok)+"</span>";
      last=m.index+tok.length;
    }
    return res+esc(src.slice(last));
  }
  function render(){
    hlcode.innerHTML=highlight(editor.value)+"\n";   // trailing newline keeps scroll height aligned
    const n=editor.value.split("\n").length;
    let g=""; for(let i=1;i<=n;i++) g+=i+"\n";
    gutter.textContent=g;
  }
  editor.addEventListener("input",render);
  editor.addEventListener("scroll",()=>{
    hl.scrollTop=editor.scrollTop; hl.scrollLeft=editor.scrollLeft;
    gutter.scrollTop=editor.scrollTop;
  });
  editor.addEventListener("keydown",(e)=>{
    if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){ e.preventDefault(); runCreation(); return; }
    if(e.key==="Tab"){
      e.preventDefault();
      const s=editor.selectionStart, en=editor.selectionEnd;
      editor.value=editor.value.slice(0,s)+"  "+editor.value.slice(en);
      editor.selectionStart=editor.selectionEnd=s+2;
      render();
    }
  });

  function addLine(text,cls){
    let c=cls||"";
    if(!c&&(text.charAt(0)==="["||text.indexOf("🔮")===0||text.indexOf("🕊")===0)) c="divine";
    const d=document.createElement("div");
    d.className="cline"+(c?" "+c:"");
    d.textContent=text;
    out.appendChild(d);
  }
  function runCreation(){
    out.innerHTML="";
    addLine("——— BEGIN CREATION · "+new Date().toLocaleTimeString()+" ———","dim");
    const interp=new Interpreter();
    try{ interp.run(editor.value); }
    catch(e){
      for(const l of interp.output) addLine(l);
      if(e instanceof GodError) addLine("✝ line "+(e.line||"?")+": "+e.message,"err");
      else addLine("✝ "+((e&&e.message)||String(e)),"err");
      out.scrollTop=out.scrollHeight;
      return;
    }
    for(const l of interp.output) addLine(l);
    out.scrollTop=out.scrollHeight;
  }

  for(const s of SAMPLES){
    const o=document.createElement("option");
    o.value=s.id; o.textContent=s.label;
    samplesSel.appendChild(o);
  }
  samplesSel.addEventListener("change",()=>{
    const s=SAMPLES.find(x=>x.id===samplesSel.value);
    if(s){
      editor.value=s.code; render(); runCreation();
      // The link always reflects the editor: a sample replaces any shared link.
      try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
    }
  });
  function shareCreation(){
    try{
      const url=location.href.split("#")[0]+"#c="+b64urlEncode(editor.value);
      history.replaceState(null,"",url);
      const done=()=>addLine("🔗 Share link copied to the clipboard.","divine");
      const manual=()=>addLine("🔗 Your share link is in the address bar.","divine");
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(url).then(done,manual);
      }else{
        const ta=document.createElement("textarea");
        ta.value=url; ta.style.position="fixed"; ta.style.opacity="0";
        document.body.appendChild(ta); ta.select();
        try{ document.execCommand("copy"); done(); }catch(e){ manual(); }
        document.body.removeChild(ta);
      }
    }catch(e){ addLine("✝ The share link could not be sealed: "+((e&&e.message)||e),"err"); }
  }
  document.getElementById("shareBtn").addEventListener("click",shareCreation);
  document.getElementById("runBtn").addEventListener("click",runCreation);
  document.getElementById("clearBtn").addEventListener("click",()=>{ out.innerHTML=""; });

  // Boot: a shared link wins over the first sample.
  (function(){
    let shared=null;
    try{
      if(location.hash.indexOf("#c=")===0) shared=b64urlDecode(location.hash.slice(3));
    }catch(e){ shared=null; }
    if(shared===null||shared===undefined){
      editor.value=SAMPLES[0].code;
    }else{
      editor.value=shared;
      // Name the shared code honestly in the samples dropdown.
      const o=document.createElement("option");
      o.value="__shared"; o.textContent="Shared creation";
      samplesSel.insertBefore(o,samplesSel.firstChild);
      samplesSel.value="__shared";
    }
    render();
    runCreation();
  })();
}
</script>
</body>
</html>
